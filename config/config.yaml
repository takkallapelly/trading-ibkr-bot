backtest:
  commission_per_share: 0.005
  embargo_pct: 0.01
  end_date: '2024-12-31'
  initial_capital: 25000
  n_splits: 6
  report_dir: reports
  slippage_bps: 5
  start_date: '2020-01-01'
  test_months: 3
  train_months: 12
dashboard:
  equity_curve_days: 90
  refresh_seconds: 30
  rolling_sharpe_window: 30
data:
  bar_size: 5 mins
  fractional_diff_d: 0.4
  history_days: 365
  min_sample_length: 100
  raw_path: data/raw
  store_path: data/processed
logging:
  dir: logs
  format: '{time:YYYY-MM-DD HH:mm:ss} | {level} | {name} | {message}'
meta_labeler:
  confidence_threshold: 0.55
  enabled: false
  max_depth: 4
  model_dir: models
  model_type: random_forest
  n_estimators: 200
risk:
  atr_period: 14
  consecutive_loss_halt: 5
  correlation_threshold: 0.7
  daily_drawdown_halt: 0.03
  kelly_fraction: 0.5
  kelly_lookback: 30
  max_open_positions: 3
  max_position_usd: 2500
  stop_loss_atr_mult: 1.5
  take_profit_atr_mult: 3.0
signals:
  avoid_first_minutes: 15
  avoid_last_minutes: 15
  bollinger:
    period: 20
    std_dev: 2.0
    weight: 0.3
  ema:
    fast: 9
    slow: 20
    weight: 0.2
  long_only: true
  min_signal_score: 0.65
  rsi:
    overbought: 90
    oversold: 10
    period: 2
    weight: 0.5
tickers:
  universe:
  - AVGO
  - META
  - MSFT
  - COST
